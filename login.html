<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Log in</title>
    <link rel="icon" href="./assets/images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #121212;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        .header {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 2rem 0 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
        .logo i { font-size: 2rem; color: #1DB954; }
        .logo span { font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: -0.03em; }

        /* Card */
        .card {
            background: #282828;
            border-radius: 16px;
            padding: 2.5rem 3rem;
            width: 100%;
            max-width: 420px;
            margin: 2.5rem auto;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        /* Social buttons */
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
            width: 100%;
            padding: 0.85rem;
            border-radius: 500px;
            border: 1px solid rgba(255,255,255,0.25);
            background: transparent;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.85rem;
            transition: border-color 0.2s, background 0.2s;
        }
        .social-btn:hover { border-color: #fff; background: rgba(255,255,255,0.05); }
        .social-btn i { font-size: 1.1rem; }
        .social-btn .google-icon { color: #ea4335; }
        .social-btn .fb-icon { color: #1877f2; }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: #727272;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.12);
        }

        /* Form */
        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: #fff;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: #3e3e3e;
            border: 1px solid #3e3e3e;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input:focus {
            border-color: #fff;
            background: #484848;
        }
        input::placeholder { color: #727272; }

        /* Password toggle */
        .input-wrapper { position: relative; }
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #727272;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: #fff; }

        /* Submit button */
        .btn-primary {
            width: 100%;
            background: #1DB954;
            color: #000;
            border: none;
            border-radius: 500px;
            padding: 0.9rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: background 0.2s, transform 0.15s;
            margin-top: 0.5rem;
        }
        .btn-primary:hover { background: #1ed760; transform: scale(1.02); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Error message */
        .error-msg {
            background: rgba(255, 87, 87, 0.12);
            border: 1px solid rgba(255, 87, 87, 0.3);
            color: #ff5757;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: none;
        }
        .error-msg.show { display: block; }

        /* Success */
        .success-msg {
            background: rgba(29, 185, 84, 0.12);
            border: 1px solid rgba(29, 185, 84, 0.3);
            color: #1DB954;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: none;
        }
        .success-msg.show { display: block; }

        /* Forgot password */
        .forgot {
            display: inline-block;
            margin-top: 0.5rem;
            color: #fff;
            font-size: 0.8rem;
            text-decoration: underline;
            cursor: pointer;
            opacity: 0.7;
        }
        .forgot:hover { opacity: 1; }

        /* Footer */
        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 0.875rem;
            color: #727272;
        }
        .auth-footer a {
            color: #fff;
            font-weight: 700;
            text-decoration: underline;
        }
        .auth-footer a:hover { color: #1DB954; }

        /* Spinner */
        .spinner { display: none; }
        .btn-primary.loading .spinner { display: inline-block; margin-right: 0.5rem; }
        .btn-primary.loading .btn-text { display: none; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">
            <i class="fa-brands fa-spotify"></i>
            <span>Spotify</span>
        </a>
    </header>

    <main>
        <div class="card">
            <h1>Log in to Spotify</h1>

            <!-- Social Login (UI only, can be wired later) -->
            <button class="social-btn" onclick="showToast('Google login coming soon')">
                <i class="fab fa-google google-icon"></i>
                Continue with Google
            </button>
            <button class="social-btn" onclick="showToast('Facebook login coming soon')">
                <i class="fab fa-facebook-f fb-icon"></i>
                Continue with Facebook
            </button>

            <div class="divider">or</div>

            <!-- Error / Success messages -->
            <div class="error-msg" id="error-msg"></div>
            <div class="success-msg" id="success-msg"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="name@domain.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                        <i class="fa-regular fa-eye toggle-password" id="toggle-pass"></i>
                    </div>
                    <span class="forgot" onclick="showToast('Password reset coming soon')">Forgot your password?</span>
                </div>

                <button type="submit" class="btn-primary" id="login-btn">
                    <i class="fa-solid fa-spinner fa-spin spinner"></i>
                    <span class="btn-text">Log In</span>
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up for Spotify</a>
            </div>
        </div>
    </main>

    <script>
        const API = '/api';

        // Toggle password visibility
        document.getElementById('toggle-pass').addEventListener('click', function () {
            const input = document.getElementById('password');
            const isPass = input.type === 'password';
            input.type = isPass ? 'text' : 'password';
            this.className = `fa-regular ${isPass ? 'fa-eye-slash' : 'fa-eye'} toggle-password`;
        });

        // Login form submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('error-msg');
            const sucEl = document.getElementById('success-msg');
            errEl.classList.remove('show');
            sucEl.classList.remove('show');

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res  = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!data.success) {
                    errEl.textContent = data.message || 'Login failed. Please try again.';
                    errEl.classList.add('show');
                } else {
                    // Save token + user
                    localStorage.setItem('spotify_token', data.token);
                    localStorage.setItem('spotify_user', JSON.stringify(data.user));
                    sucEl.textContent = `Welcome back, ${data.user.username}! Redirecting...`;
                    sucEl.classList.add('show');
                    setTimeout(() => window.location.href = 'index.html', 1200);
                }
            } catch (err) {
                errEl.textContent = 'Cannot connect to server. Make sure the backend is running.';
                errEl.classList.add('show');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });

        // Toast helper
        function showToast(msg) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#282828;color:#fff;padding:0.75rem 1.5rem;border-radius:500px;font-size:0.85rem;font-weight:600;z-index:9999;opacity:0;transition:opacity 0.3s;font-family:Montserrat,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,0.5);';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }

        // If already logged in, redirect
        if (localStorage.getItem('spotify_token')) {
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
