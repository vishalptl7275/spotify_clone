name: Extract and repair Spotify Clone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract clean source and repair deployment setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/spotify-archive
          unzip -q spotify.zip -d /tmp/spotify-archive
          test -f /tmp/spotify-archive/spotify/index.html
          cp -a /tmp/spotify-archive/spotify/. .
          rm -rf backend/node_modules backend/.git backend/.env __MACOSX
          find . -name '.DS_Store' -delete
          cat > .gitignore <<'EOF'
          node_modules/
          .env
          .env.*
          !.env.example
          backend/.env
          backend/node_modules/
          .DS_Store
          *.log
          EOF
          cat > .env.example <<'EOF'
          DB_HOST=db
          DB_USER=spotifyapp
          DB_PASSWORD=replace-with-a-long-random-password
          DB_NAME=spotify_clone
          MYSQL_ROOT_PASSWORD=replace-with-a-different-long-random-password
          JWT_SECRET=replace-with-at-least-32-random-characters
          JWT_EXPIRES_IN=7d
          PORT=3000
          EOF
          cat > backend/.env.example <<'EOF'
          DB_HOST=127.0.0.1
          DB_USER=spotifyapp
          DB_PASSWORD=replace-with-your-local-database-password
          DB_NAME=spotify_clone
          JWT_SECRET=replace-with-at-least-32-random-characters
          JWT_EXPIRES_IN=7d
          PORT=3000
          EOF
          cat > backend/config/db.js <<'EOF'
          const mysql = require('mysql2/promise');
          const required = ['DB_HOST', 'DB_USER', 'DB_PASSWORD', 'DB_NAME'];
          const missing = required.filter((key) => !process.env[key]);
          if (missing.length) throw new Error('Missing database environment variables: ' + missing.join(', '));
          module.exports = mysql.createPool({
              host: process.env.DB_HOST,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
              waitForConnections: true,
              connectionLimit: 10,
              queueLimit: 0,
              decimalNumbers: true,
          });
          EOF
          cat > backend/server.js <<'EOF'
          const path = require('path');
          require('dotenv').config({ path: path.join(__dirname, '.env') });
          const express = require('express');
          const pool = require('./config/db');
          const app = express();

          app.disable('x-powered-by');
          app.use(express.json({ limit: '100kb' }));
          app.use(express.urlencoded({ extended: true, limit: '100kb' }));

          const frontendDir = process.env.FRONTEND_DIR || path.join(__dirname, '..');
          app.use(express.static(frontendDir, { dotfiles: 'deny', index: false }));
          app.use('/api/auth', require('./routes/auth'));
          app.use('/api/playlists', require('./routes/playlists'));
          app.use('/api/songs', require('./routes/songs'));

          app.get('/api/health', (req, res) => {
              res.json({ success: true, message: 'Spotify Clone API is running' });
          });
          app.get('*', (req, res) => res.sendFile(path.join(frontendDir, 'index.html')));
          app.use((err, req, res, next) => {
              console.error(err);
              res.status(500).json({ success: false, message: 'Internal server error' });
          });

          async function start() {
              if (!process.env.JWT_SECRET || process.env.JWT_SECRET.length < 32) {
                  throw new Error('JWT_SECRET must contain at least 32 characters.');
              }
              const connection = await pool.getConnection();
              connection.release();
              const port = Number(process.env.PORT || 3000);
              app.listen(port, '0.0.0.0', () => console.log('Spotify Clone listening on port ' + port));
          }
          start().catch((error) => {
              console.error('Startup failed:', error.message);
              process.exit(1);
          });
          process.once('SIGTERM', async () => { await pool.end(); process.exit(0); });
          process.once('SIGINT', async () => { await pool.end(); process.exit(0); });
          EOF
          sed -i "s|http://localhost:3000/api|/api|g" login.html signup.html
          cat > Dockerfile <<'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY backend/package*.json ./backend/
          WORKDIR /app/backend
          RUN npm ci --omit=dev
          WORKDIR /app
          COPY index.html login.html signup.html ./public/
          COPY assets ./public/assets
          COPY backend ./backend
          WORKDIR /app/backend
          ENV NODE_ENV=production
          EXPOSE 3000
          CMD ["npm", "start"]
          EOF
          cat > docker-compose.yml <<'EOF'
          services:
            db:
              image: mysql:8.4
              restart: unless-stopped
              environment:
                MYSQL_DATABASE: spotify_clone
                MYSQL_USER: spotifyapp
                MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
                MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
              volumes:
                - spotify_db:/var/lib/mysql
                - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "spotifyapp", "--password=${DB_PASSWORD}"]
                interval: 10s
                timeout: 5s
                retries: 15
            app:
              build: .
              restart: unless-stopped
              depends_on:
                db:
                  condition: service_healthy
              environment:
                PORT: 3000
                FRONTEND_DIR: /app/public
                DB_HOST: db
                DB_USER: spotifyapp
                DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
                DB_NAME: spotify_clone
                JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
                JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
              ports:
                - "${APP_PORT:-3000}:3000"
          volumes:
            spotify_db:
          EOF
          cat > README.md <<'EOF'
          # Spotify Clone

          A Spotify-inspired web app with an HTML/CSS/JavaScript frontend and an Express/MySQL backend. It includes signup/login, playlists, liked songs and recently played metadata.

          ## Run with Docker

          Requirements: Docker Desktop with Docker Compose.

          1. Copy .env.example to .env.
          2. Set unique, strong values for DB_PASSWORD, MYSQL_ROOT_PASSWORD and JWT_SECRET (at least 32 random characters).
          3. Run: docker compose up --build -d
          4. Open http://localhost:3000 and create an account using Sign Up.

          MySQL initializes the spotify_clone database from backend/schema.sql on first startup. Data persists in the spotify_db volume. View logs with docker compose logs -f app. Stop with docker compose down. The command docker compose down -v also deletes the database volume.

          ## Run locally

          Install Node.js 20+ and MySQL 8+. Create the database using backend/schema.sql, configure the DB_* and JWT_* environment variables, then run npm ci and npm start from the backend directory. Open http://localhost:3000.

          ## Security and limitations

          Secrets are environment variables; never commit .env. Playlist endpoints must enforce ownership. This is a learning project, not an official Spotify client; it uses third-party music metadata and preview sources. Review API terms, privacy, rate limits and security before public production use.
          EOF
          cat > .dockerignore <<'EOF'
          .git
          .env
          backend/.env
          backend/node_modules
          node_modules
          *.zip
          .DS_Store
          EOF
          cat > .github/workflows/ci.yml <<'EOF'
          name: Spotify Clone CI
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
          permissions:
            contents: read
          jobs:
            test:
              runs-on: ubuntu-latest
              services:
                mysql:
                  image: mysql:8.4
                  env:
                    MYSQL_ROOT_PASSWORD: root-test-password
                    MYSQL_DATABASE: spotify_clone
                    MYSQL_USER: spotifyapp
                    MYSQL_PASSWORD: app-test-password
                  ports:
                    - 3306:3306
                  options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '20'
                - name: Install backend dependencies
                  working-directory: backend
                  run: npm ci
                - name: Check JavaScript syntax
                  run: |
                    node --check backend/server.js
                    find backend/config backend/middleware backend/routes -name '*.js' -print0 | xargs -0 -n1 node --check
                - name: Initialize database
                  run: mysql -h 127.0.0.1 -uroot -proot-test-password < backend/schema.sql
                - name: Start API and verify health
                  env:
                    PORT: 3000
                    DB_HOST: 127.0.0.1
                    DB_USER: spotifyapp
                    DB_PASSWORD: app-test-password
                    DB_NAME: spotify_clone
                    JWT_SECRET: test-only-secret-that-is-at-least-32-characters-long
                  run: |
                    cd backend
                    node server.js > /tmp/spotify-api.log 2>&1 &
                    for i in $(seq 1 30); do
                      if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
                      sleep 2
                    done
                    cat /tmp/spotify-api.log
                    exit 1
                - name: Build Docker image
                  run: docker build -t spotify-clone:ci .
          EOF
          rm -f .github/workflows/inspect-archive.yml
          rm -f spotify.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract clean Spotify source and add deployable MySQL stack"
            git push
          fi
