name: Inspect Spotify Clone Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and safely report project structure
        run: |
          mkdir -p extracted
          unzip -q spotify.zip -d extracted
          APP="extracted/spotify"
          echo "FILE COUNT: $(find "$APP" -type f | wc -l)"
          echo "TOP-LEVEL:"
          find "$APP" -maxdepth 2 -type f ! -path '*/node_modules/*' ! -path '*/.git/*' | sort
          echo "ENVIRONMENT VARIABLE NAMES ONLY (values intentionally hidden):"
          if [ -f "$APP/backend/.env" ]; then
            sed -E 's/[[:space:]]*=[[:space:]]*.*/=<redacted>/' "$APP/backend/.env" | sed '/^#/d;/^$/d'
          else
            echo "No backend .env file"
          fi
          echo "BACKEND PACKAGE:"
          cat "$APP/backend/package.json"
          echo "DATABASE SCHEMA:"
          sed -E "s/(IDENTIFIED BY)[[:space:]]+('[^']*')/\1 '<redacted>'/Ig" "$APP/backend/schema.sql"
          echo "SERVER SOURCE (credential-like literals redacted):"
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("extracted/spotify/backend/server.js")
          if p.exists():
              s=p.read_text(errors="replace")
              s=re.sub(r'(?i)((?:password|secret|token|api[_-]?key|jwt[_-]?secret)\s*[:=]\s*["\'\x60])[^"\'\x60]+',r'\1<redacted>',s)
              print(s)
          PY
          echo "FRONTEND API REFERENCES:"
          grep -RInE 'fetch\(|axios\.|localhost|/api/' "$APP" --include='*.html' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git | head -120 || true
