name: Inspect Spotify Clone Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and safely report project structure
        run: |
          mkdir -p extracted
          unzip -q spotify.zip -d extracted
          APP="extracted/spotify"
          echo "FILE COUNT: $(find "$APP" -type f | wc -l)"
          echo "SOURCE TREE (excluding dependency folders):"
          find "$APP" -maxdepth 4 -type f ! -path '*/node_modules/*' ! -path '*/.git/*' ! -name '.DS_Store' | sort
          echo "ENVIRONMENT KEY STATUS ONLY:"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("extracted/spotify/backend/.env")
          if p.exists():
              for line in p.read_text(errors="replace").splitlines():
                  line=line.strip()
                  if not line or line.startswith("#") or "=" not in line: continue
                  key,value=line.split("=",1)
                  v=value.strip().strip('"').strip("'")
                  state="empty" if not v else ("placeholder-looking" if any(x in v.lower() for x in ["your_", "replace", "changeme", "example", "localhost"]) else "non-empty; treat as potentially sensitive")
                  print(f"{key.strip()}: {state}")
          else:
              print("No .env file")
          PY
          echo "BACKEND PACKAGE:"
          cat "$APP/backend/package.json"
          echo "DB CONNECTION MODULE:"
          sed -E "s/(password[[:space:]]*:[[:space:]]*)[^,]+/\1'<redacted>'/Ig" "$APP/backend/config/db.js"
          echo "AUTH ROUTE SOURCE (secret literals redacted):"
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("extracted/spotify/backend/routes/auth.js")
          if p.exists():
              s=p.read_text(errors="replace")
              s=re.sub(r'(?i)((?:password|secret|token|api[_-]?key|jwt[_-]?secret)\s*[:=]\s*["\'\x60])[^"\'\x60]+',r'\1<redacted>',s)
              print(s)
          PY
          echo "DATABASE SCHEMA:"
          sed -E "s/(IDENTIFIED BY)[[:space:]]+('[^']*')/\1 '<redacted>'/Ig" "$APP/backend/schema.sql"
          echo "FRONTEND LOCALHOST REFERENCES:"
          grep -RIn 'localhost:3000' "$APP" --include='*.html' || true
